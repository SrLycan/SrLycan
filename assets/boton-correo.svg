  <stop offset=".6" stop-color="#3db4ef" stop-opacity=".06"/>
  <stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<linearGradient id="reflejo" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/>
  <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#5cc6f7"/><stop offset=".5" stop-color="#3db4ef"/>
  <stop offset="1" stop-color="#93d6f8"/></linearGradient>
<linearGradient id="boton" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#6fd0fb"/><stop offset="1" stop-color="#3db4ef"/></linearGradient>
<linearGradient id="destello" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#93d6f8" stop-opacity="0"/>
  <stop offset=".5" stop-color="#93d6f8" stop-opacity=".22"/>
  <stop offset="1" stop-color="#93d6f8" stop-opacity="0"/></linearGradient>
<filter id="difuso" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter><clipPath id="bc"><rect width="172" height="56" rx="14"/></clipPath></defs><rect width="172" height="56" rx="14" fill="url(#boton)"/><rect x="14" y="0" width="144" height="1.2" fill="#fff" opacity=".6"/><g clip-path="url(#bc)"><g class="cruza no-rm"><rect x="-200" y="-20" width="70" height="96" fill="#fff" opacity=".35" transform="skewX(-20)"/></g></g><g transform="translate(24 19)" fill="none" stroke="#0d1117" stroke-width="1.8" stroke-linejoin="round"><rect x="0" y="0" width="20" height="16" rx="3"/><path d="M1 2l9 7 9-7"/></g><text x="56.0" y="34.5" font-family="Outfit" font-weight="600" font-size="17" fill="#0d1117" >Escríbeme</text><path d="M146.852 28h12m-5-5 5 5-5 5" fill="none" stroke="#0d1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>