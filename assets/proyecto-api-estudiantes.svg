<svg xmlns="http://www.w3.org/2000/svg" width="900" height="236" viewBox="0 0 900 236" role="img" aria-label="Proyecto API REST Estudiantes"><title>Proyecto API REST Estudiantes</title><style>@font-face{font-family:'Outfit';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'Outfit';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
