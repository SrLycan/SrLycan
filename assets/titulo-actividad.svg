  <stop offset="0" stop-color="#93d6f8" stop-opacity="0"/>
  <stop offset=".5" stop-color="#93d6f8" stop-opacity=".22"/>
  <stop offset="1" stop-color="#93d6f8" stop-opacity="0"/></linearGradient>
<filter id="difuso" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
<clipPath id="marco"><rect width="900" height="150" rx="26"/></clipPath>
