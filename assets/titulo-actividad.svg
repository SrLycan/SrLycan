t="600" font-size="13" fill="#3db4ef" letter-spacing="0.16em" >ACTIVIDAD</text></g><g class="entra" style="animation-delay:0.1s"><text x="50.0" y="110.0" font-family="Sora" font-weight="700" font-size="34" fill="#eef3f7" letter-spacing="-0.03em" >En </text><text x="96.4" y="110.0" font-family="Sora" font-weight="700" font-size="34" fill="url(#acento)" letter-spacing="-0.03em" >GitHub</text></g></svg>